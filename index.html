<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafolio - Laura Torres</title>
  
  <!-- Cargar Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Cargar las tipografías de Google Fonts (Poppins y Open Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- Cargar tu propio CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Menu de Navegacion (Navbar) -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand brand-title" href="#">Laura Torres</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#inicio">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="#sobre-mi">Sobre Mí</a></li>
          <li class="nav-item"><a class="nav-link" href="#tecnologias">Tecnologías</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Encabezado / Banner Principal -->
  <header id="inicio" class="hero-section text-center py-5">
    <div class="container">
      <h1 class="display-4 font-poppins">¡Hola, soy Laura Torres!</h1>
      <p class="lead text-sub">Desarrolladora Full Stack en proceso</p>
      <a href="#contacto" class="btn btn-custom mt-3">Ver mi trabajo</a>
    </div>
  </header>

  <!-- Seccion Sobre Mi -->
  <section id="sobre-mi" class="container my-5">
    <h2 class="font-poppins">Sobre Mí</h2>
    <p>Apasionada por el desarrollo web y la creación de experiencias digitales interactivas.</p>
  </section>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
